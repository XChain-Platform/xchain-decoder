# Delegates to the shared reusable workflow, pinned to a commit SHA rather than
# @master so a change to the shared definition only reaches this repo when the
# SHA is bumped deliberately.
name: CI

on:
  push:
    branches: [master]          # use [main] for repos whose default branch is main
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: XChain-Platform/.github/.github/workflows/ci-reusable.yml@aae44352361242d334234593c39d88be007d2ed3 # pin: XChain-Platform/.github @ master 2026-07-08; bump deliberately

  # Cross-repo drift guards: this repo vendors the canonical coin registry from
  # xchain-hub, and per-repo CI cannot see sibling repos, so a drifted vendored
  # copy would otherwise ship green. This job recreates the sibling layout (self
  # and canonical side by side) and runs the byte-identity checks. The canonical
  # repo is private pre-launch, so its checkout uses a read-only deploy key; drop
  # the ssh-key line when the repos flip public.
  drift-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-decoder

      - name: Check out the canonical coin registry (xchain-hub)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-hub
          ssh-key: ${{ secrets.XCHAIN_HUB_DEPLOY_KEY }}
          path: xchain-hub

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Coin-registry byte-identity vs canonical
        run: xchain-hub/bin/sync-coins.sh --check --only xchain-decoder

      - name: Coin consensus-pin conformance (own vendored bundle)
        working-directory: xchain-decoder
        run: |
          node -e '
            const coins = require("./src/coins");
            for (const net of ["testnet", "regtest"]) {
              const res = coins.verifyConsensusPin(net);
              if (res && res.skipped) throw new Error("consensus pin unexpectedly unarmed for " + net);
            }
            console.log("consensus pin conformance OK (testnet, regtest)");
          '

  # Docker-gated tiers: the integration and e2e suites each bring up their own
  # throwaway regtest node and MariaDB with docker compose, so they cannot run
  # inside `npm run ci`. They get their own job on a runner that has docker, so a
  # slow or flaky venue cannot hold up the fast tier's signal. The map of which
  # tier is gated where lives in test/tier-manifest.json and is enforced by
  # test/unit/tierManifest.test.js.
  docker-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Each script owns its venue lifecycle (up --wait, run, down -v on any exit),
      # so no compose teardown step is needed here.
      - name: Integration tier
        run: npm run test:integration

      - name: End-to-end tier
        run: npm run test:e2e

  # Coverage ratchet: re-run the unit suite under c8 and fail if line or branch
  # coverage drops below this repo's floor in bin/coverage-thresholds.json
  # (mirrored into the `coverage:check` npm script). Catches the silent coverage
  # regression the pass/fail gate cannot see, where a change keeps every test
  # green while deleting the only test that reached a file. The floors sit about
  # a point below measured; raise them as coverage climbs.
  coverage:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Coverage thresholds (c8 --check-coverage)
        run: npm run coverage:check
