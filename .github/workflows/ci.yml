name: CI

# Hermetic unit-test gate (`npm run ci` = unit suite). The default `npm test`
# requires a live regtest node (prepareRegtest); CI runs the unit-only subset.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test gate
        run: npm run ci
