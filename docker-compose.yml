version: '3'

services:
  xchain_decoder:
    build: .
    # The image bakes no .env (Dockerfile); the README's .env is handed to the
    # container here instead.
    env_file: .env
    volumes:
      - xchain_decoder_data:/data/
    networks: 
      - network1
    ports:
      - "3001:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "10"
        
networks:
  network1:
    name: xchain_network
    external: true
    
volumes:
  xchain_decoder_data: