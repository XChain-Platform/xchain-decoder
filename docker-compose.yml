version: '3'

services:
  xchain_decoder:
    build: .
    # The image bakes no .env (Dockerfile); the README's .env is handed to the
    # container here instead.
    env_file: .env
    # Compose's own stop wait is 10 s, which would SIGKILL a drain still rolling
    # back. This matches the 120 s xchain-node stamps on the container and must stay
    # above SHUTDOWN_TIMEOUT_MS (default 100000), so the drain ends in a logged exit
    # before the daemon steps in; raise both together.
    stop_grace_period: 120s
    volumes:
      - xchain_decoder_data:/data/
    networks: 
      - network1
    ports:
      - "3001:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "10"
        
networks:
  network1:
    name: xchain_network
    external: true
    
volumes:
  xchain_decoder_data: